<div class="legend-inline">
  @for (line of lines; track $index) {
    <div class="legend-line">
      @if ($first) {
        <span
          class="legend-title"
          nz-typography
          nzType="secondary"
          >Field States:</span
        >
      }
      @for (item of line; track item.state) {
        <nz-tag
          [class]="'legend-item ' + item.state"
          nz-tooltip
          [nzTooltipTitle]="item.hint">
          @if (item.icon) {
            <span
              class="legend-marker"
              nz-icon
              [nzType]="item.icon"
              nzTheme="outline"></span>
          } @else if (item.state === 'required') {
            <span class="legend-marker marker-circle filled"></span>
          } @else {
            <span class="legend-marker marker-circle"></span>
          }
          {{ item.label }}
        </nz-tag>
      }
    </div>
  }
</div>
