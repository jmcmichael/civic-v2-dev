<nz-spin [nzSpinning]="state()?.isSubmitting() ?? false">
  @if (state()?.success()) {
    <nz-alert
      nzType="success"
      nzShowIcon
      nzMessage="{{ entityType }} Submitted"
      [nzDescription]="successMessage ? successMessage : null"></nz-alert>
  } @else {
    <ng-content></ng-content>
  }
</nz-spin>
