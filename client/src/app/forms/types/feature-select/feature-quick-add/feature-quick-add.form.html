@if (showForm()) {
  @if (formMessage(); as message) {
    <span>{{ message }}</span>
  }
  <cvc-form-submission-status-display
    [mutationState]="mutationState"
    entityType="Feature"
    [successMessage]="success">
    <!-- FIXME: network errors (e.g. not logged in err) are not being displayed -->
    <ng-template #success>{{ successMessage }}</ng-template>
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit(model)">
      <nz-row [nzGutter]="[0, 0]">
        <nz-col nzSpan="24">
          <formly-form
            [form]="form"
            [fields]="fields"
            [model]="model"
            [options]="options"
            (modelChange)="model = $event">
          </formly-form>
        </nz-col>
      </nz-row>
    </form>
  </cvc-form-submission-status-display>
}
