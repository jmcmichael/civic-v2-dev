<!-- hidden field, stores field value and hooks into formly's updates -->
<input
  type="hidden"
  [formControl]="formControl"
  [formlyAttributes]="field" />

<div
  class="btn-aligner"
  [ngClass]="{
    'btn-right': props.align === 'right',
    'btn-left': props.align === 'left',
    'btn-center': props.align === 'center',
  }">
  <cvc-form-error-tag
    class="submit-error-tag"
    variant="alert" />
  <button
    type="submit"
    nz-button
    [disabled]="!formValid()"
    nzType="primary"
    nz-tooltip
    [nzTooltipTrigger]="mostRecentOrg() ? 'hover' : null"
    [nzTooltipTitle]="'For ' + mostRecentOrg()?.name">
    {{ props.submitLabel }}
  </button>
</div>
