<!-- hidden field, stores field value and hooks into formly's updates -->
<input
  type="hidden"
  [formControl]="formControl"
  [formlyAttributes]="field" />

<div
  class="btn-aligner"
  [ngClass]="{
    'btn-right': props.align === 'right',
    'btn-left': props.align === 'left',
    'btn-center': props.align === 'center',
  }">
  <cvc-form-error-alert
    class="submit-error-alert"
    variant="alert"
    [readiness]="{ valid: formValid(), issues: fieldIssues() }" />
  <!--
    The tooltip sits on a wrapper, not the button: a disabled button fires no
    pointer events, so a tooltip bound to it goes silent in exactly the state
    the curator most needs it to speak.
  -->
  <span
    class="submit-btn"
    nz-tooltip
    [nzTooltipTrigger]="tooltipTitle() ? 'hover' : null"
    [nzTooltipTitle]="tooltipTitle()">
    <button
      type="submit"
      nz-button
      [disabled]="!formValid()"
      nzType="primary"
      [nzDanger]="submitError()"
      [nzSize]="props.size ?? 'default'">
      @if (submitError()) {
        <span
          nz-icon
          nzType="close-circle"
          nzTheme="fill"></span>
      }
      {{ props.submitLabel }}
    </button>
  </span>
</div>
