<!-- hidden field, stores field value and hooks into formly's updates -->
<input
  type="hidden"
  [formControl]="formControl"
  [formlyAttributes]="field" />

<div
  class="btn-aligner"
  [ngClass]="{
    'btn-right': props.align === 'right',
    'btn-left': props.align === 'left',
    'btn-center': props.align === 'center',
  }">
  <cvc-form-error-alert
    class="submit-error-alert"
    variant="alert"
    [readiness]="{
      valid: formValid(),
      issues: fieldIssues(),
      summary: fieldValues(),
      formConfig: formConfig,
    }" />
  <button
    type="submit"
    nz-button
    [disabled]="!formValid()"
    nzType="primary"
    [nzDanger]="submitError()"
    [nzSize]="props.size ?? 'default'"
    nz-tooltip
    [nzTooltipTrigger]="mostRecentOrg() ? 'hover' : null"
    [nzTooltipTitle]="'For ' + mostRecentOrg()?.name">
    @if (submitError()) {
      <span
        nz-icon
        nzType="close-circle"
        nzTheme="fill"></span>
    }
    {{ props.submitLabel }}
  </button>
</div>
