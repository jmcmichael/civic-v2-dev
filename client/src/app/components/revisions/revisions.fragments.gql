# Revision leaf fragments shared across features.
#
# `revisionLinkoutData` renders the entity a revised field points at. It is
# read by the revisions list, the revision popover's callers, and the
# activity stream's revision detail — so it lives here rather than inside any
# one component's document, where a cross-feature import would follow the
# consumer rather than the data.

fragment revisionLinkoutData on LinkoutData {
  name
  diffValue {
    ... on ObjectFieldDiff {
      currentObjects {
        id
        displayName
        displayType
        entityType
        link
        deleted
        deprecated
        flagged
        feature {
          link
          id
          name
          deprecated
          flagged
          featureType
        }
      }
      addedObjects {
        id
        displayName
        displayType
        entityType
        link
        deleted
        deprecated
        flagged
        feature {
          link
          id
          name
          deprecated
          flagged
          featureType
        }
      }
      removedObjects {
        id
        displayName
        displayType
        entityType
        link
        deleted
        deprecated
        flagged
        feature {
          link
          id
          name
          deprecated
          flagged
          featureType
        }
      }
      keptObjects {
        id
        displayName
        displayType
        entityType
        link
        deleted
        deprecated
        flagged
        feature {
          link
          id
          name
          deprecated
          flagged
          featureType
        }
      }
      suggestedObjects {
        id
        displayName
        displayType
        entityType
        link
        deleted
        deprecated
        flagged
        feature {
          link
          id
          name
          deprecated
          flagged
          featureType
        }
      }
    }
    ... on ScalarFieldDiff {
      left
      right
    }
  }
}
