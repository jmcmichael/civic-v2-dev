query EvidenceBrowse(
  $first: Int
  $last: Int
  $before: String
  $after: String
  $diseaseName: String
  $therapyName: String
  $id: Int
  $ids: [Int!]
  $description: String
  $evidenceLevels: [EvidenceLevel!]
  $evidenceDirections: [EvidenceDirection!]
  $significances: [EvidenceSignificance!]
  $evidenceTypes: [EvidenceType!]
  $evidenceRatings: [Int!]
  $variantOrigins: [VariantOrigin!]
  $variantId: Int
  $molecularProfileId: Int
  $assertionId: Int
  $organization: OrganizationFilter
  $userId: Int
  $sortBy: EvidenceSort
  $phenotypeId: Int
  $diseaseId: Int
  $therapyId: Int
  $therapyInteractionType: TherapyInteraction
  $sourceId: Int
  $clinicalTrialId: Int
  $molecularProfileName: String
  $status: EvidenceStatusFilter
) {
  evidenceItems(
    first: $first
    last: $last
    before: $before
    after: $after
    diseaseName: $diseaseName
    therapyName: $therapyName
    id: $id
    ids: $ids
    description: $description
    evidenceLevels: $evidenceLevels
    evidenceDirections: $evidenceDirections
    significances: $significances
    evidenceTypes: $evidenceTypes
    evidenceRatings: $evidenceRatings
    variantOrigins: $variantOrigins
    variantId: $variantId
    molecularProfileId: $molecularProfileId
    assertionId: $assertionId
    organization: $organization
    userId: $userId
    phenotypeId: $phenotypeId
    diseaseId: $diseaseId
    therapyId: $therapyId
    therapyInteractionType: $therapyInteractionType
    sourceId: $sourceId
    clinicalTrialId: $clinicalTrialId
    molecularProfileName: $molecularProfileName
    status: $status
    sortBy: $sortBy
  ) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        ...EvidenceGridFields
      }
    }
  }
}

fragment EvidenceGridFields on EvidenceItem {
  id
  name
  link
  disease {
    id
    name
    link
    deprecated
  }
  therapies {
    id
    name
    link
    deprecated
  }
  molecularProfile {
    id
    name
    link
    # the tag reads LinkableMolecularProfile from the cache, which needs
    # flagged too — one missing field renders every MP tag as '#<id>'
    flagged
    parsedName {
      ...MolecularProfileParsedName
    }
    deprecated
  }
  status
  flagged
  therapyInteractionType
  description
  evidenceType
  evidenceDirection
  evidenceLevel
  evidenceRating
  significance
  variantOrigin
}
