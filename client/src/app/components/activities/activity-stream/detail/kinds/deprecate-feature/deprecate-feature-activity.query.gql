query DeprecateFeatureActivityDetail($id: Int!) {
  activity(id: $id) {
    ...DeprecateFeatureActivityDetail
  }
}

fragment DeprecateFeatureActivityDetail on DeprecateFeatureActivity {
  parsedNote {
    ...parsedCommentFragment
  }
  molecularProfiles {
    id
    name
    link
    deprecated
    flagged
  }
  variants {
    id
    name
    link
    deprecated
    flagged
  }
  ...ActivityFeedItemBase
  ...ActivityFeedItemEvents
}
