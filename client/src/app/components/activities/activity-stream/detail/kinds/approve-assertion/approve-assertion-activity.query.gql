# different consumer: components/approvals/approval-list spreads it (beside
# RevokeApprovalActivityDetail next door) to render an assertion's approval
# and revocation history. Deleting it breaks that query, not the stream.

fragment ApproveAssertionActivityDetail on ApproveAssertionActivity {
  ...ActivityFeedItemBase
  ...ActivityFeedItemEvents
}
