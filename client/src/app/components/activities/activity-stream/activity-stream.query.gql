# The activity stream's connection document — summary-only: nodes carry the
# ActivityFeedItemBase fragment and nothing more. Expanded-item detail data
# travels in each detail component's own per-id query (see detail/), so the
# stream's pages stay small and detail fields load when a row expands.
#
# ActivityFeedItemBase is defined in ./activity-stream.fragments.gql
# so the generated-file import graph stays acyclic.
query ActivityStream(
  $subject: [SubscribableQueryInput!]
  $first: Int
  $last: Int
  $before: String
  $after: String
  $organizationId: [Int!]
  $includeSubgroups: Boolean!
  $userId: [Int!]
  $activityType: [ActivityTypeInput!]
  $subjectType: [ActivitySubjectInput!]
  $linkedApprovalId: Int
  $includeAutomatedEvents: Boolean
  $mode: EventFeedMode
  $showFilters: Boolean!
  $occurredAfter: ISO8601DateTime
  $occurredBefore: ISO8601DateTime
  $sortBy: DateSort
) {
  activities(
    subject: $subject
    first: $first
    last: $last
    before: $before
    after: $after
    userId: $userId
    linkedApprovalId: $linkedApprovalId
    includeAutomatedEvents: $includeAutomatedEvents
    organization: { ids: $organizationId, includeSubgroups: $includeSubgroups }
    activityType: $activityType
    subjectType: $subjectType
    mode: $mode
    occurredAfter: $occurredAfter
    occurredBefore: $occurredBefore
    sortBy: $sortBy
  ) {
    # filter option sources, only when a filter panel is showing
    activityTypes @include(if: $showFilters)
    uniqueParticipants @include(if: $showFilters) {
      id
      displayName
      role
    }
    subjectTypes @include(if: $showFilters)
    participatingOrganizations @include(if: $showFilters) {
      id
      name
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
    pageCount
    totalCount
    unfilteredCount
    edges {
      cursor
      node {
        ...ActivityFeedItemBase
      }
    }
  }
}
