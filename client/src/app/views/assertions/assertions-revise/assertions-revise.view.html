@if (assertion$ | async; as assertion) {
  <cvc-section-navigation
    [displayName]="assertion.name"
    [relationsTpl]="assertionRelations">
  </cvc-section-navigation>
  <ng-template #assertionRelations>
    <nz-space nzDirection="horizontal">
      <!-- parent relations -->
      <span
        nz-typography
        class="label"
        *nzSpaceItem
        ><strong>{{ assertion.name }}</strong> Parents:</span
      >
      <span
        *nzSpaceItem
        class="tags">
        <cvc-molecular-profile-tag
          [molecularProfile]="assertion.molecularProfile"
          [enablePopover]="false"></cvc-molecular-profile-tag>
      </span>
    </nz-space>
  </ng-template>
  <!-- the full-page form card replaces the nz-page-header outright: it
       carries the page title and paints the page background itself -->
  @if (isSignedIn$ | ngrxPush; as isSignedIn) {
    <router-outlet></router-outlet>
  } @else {
    <nz-row
      nzSpan="24"
      nzJustify="center">
      <div
        nz-col
        nzSpan="6">
        <cvc-login-prompt></cvc-login-prompt>
      </div>
    </nz-row>
  }
}
