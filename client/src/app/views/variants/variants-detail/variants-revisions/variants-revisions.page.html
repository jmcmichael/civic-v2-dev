<nz-tabs [nzAnimated]="false">
  @for (tab of tabs(); track tab.name) {
    <nz-tab [nzTitle]="tabTitle">
      <nz-template nz-tab>
        <cvc-revision-stream
          [cvcModerated]="tab.moderated"
          [cvcModerationRefetch]="tab.moderationRefetch"></cvc-revision-stream>
      </nz-template>
    </nz-tab>
    <ng-template #tabTitle>
      {{ tab.name }}
      @if (tab.openCount > 0) {
        <nz-badge
          nzStandalone
          [nzCount]="tab.openCount"
          [nzStyle]="{
            transform: 'scale(0.75, 0.75) translate(0, -2px)',
            backgroundColor: '#ff4d4f',
          }">
        </nz-badge>
      }
    </ng-template>
  }
</nz-tabs>
