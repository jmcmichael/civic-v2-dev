<nz-page-header
  cvcPageFill
  class="site-page-header table-page">
  <!--title-->
  <nz-page-header-title>
    <i
      nz-icon
      nzType="file-add"></i>
    Source Suggestions
  </nz-page-header-title>

  <!--content-->
  <nz-page-header-content>
    <div nz-row>
      <div
        nz-col
        [nzSpan]="24">
        <div class="content table-fill">
          <cvc-source-suggestions-table
            cvcTitle="Browse Suggested Sources"></cvc-source-suggestions-table>
        </div>
      </div>
    </div>
  </nz-page-header-content>
</nz-page-header>
